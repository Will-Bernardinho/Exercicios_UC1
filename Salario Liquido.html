<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Calculo de Salario Liquido</title>
</head>
<body>
    <script>
        var vha = prompt("Informe o valor da hora aula");
        var nhd = prompt("Informa o numero do horas dadas");
        var desc = prompt("Informe o valor do desconto");
        var sal_liq = parseFloat(vha)*parseFloat(nhd)-parseFloat(desc);
        alert("O valor do salario Liquido do Professor é: " + sal_liq);
    </script>
</body>
</html>
