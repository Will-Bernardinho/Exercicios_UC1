<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categoria</title>
</head>
<body>
    <script>
        let idade = prompt("Informe a idade");
        if (idade >=5 && idade <=7){
            alert("A categoria é infantil A");
        }
        else if (idade >=8 && idade <=10){
            alert("A categoria é infantil B");
        }
        else if(idade >=11 && idade <=13){
            alert("A categoria é juvenil A");
        }
        else if(idade >=14 && idade <=17){
            alert("A categoria é juvenil B");
        }
        else if (idade >=18){
            alert("A categoria é adulto");
        }
        else(idade <=4)
            alert("A categoria é invalida");
    </script>

</body>
</html>
