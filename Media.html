<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media</title>
</head>
<body>
    <script>
        let n1 = parseFloat(prompt("Informe a primeira nota:")) ;
        let n2 = parseFloat(prompt("Informe a segunda nota:"));
        let n3 = parseFloat(prompt("Informe a terceira nota:"));
        let n4 = parseFloat(prompt("Informe a quarta nota"));
        let media = (n1+n2+n3+n4)/4;
        if (media >= 7){
            alert("A media do aluno é: " + parseFloat(media) + "\n O aluno está aprovado");
            
        }
        else if (media <= 7){
            alert("A media do aluno é: " + parseFloat(media) + "\n O aluno esta reprovado");
            
        }
    </script>
</body>
</html>
