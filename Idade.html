<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idade</title>
</head>
<body>
    <script>
        /* O programa fará a leitura da idade e irá informar se a pessoa é Jovem até 18 anos,
        adulto entre 18 e 65 anos e idoso a partir de 65. */
        let idade = parseInt(prompt("Informe a idade"));
        if (idade > 0 && idade <= 18) {
            alert("Jovem");}
            else if (idade > 18 && idade <= 65){
                alert("Adulto")}
                else if(idade > 65){
                    alert("Idoso");
                }
                else{
                    alert("Idade inválida")
                }
        </script>
</body>
</html>
