<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversão de temperatura</title>
</head>
<body>
    <script>
        var tempc=prompt("Digite a temperatura em Celsius");
        var far = 9*tempc / 5 + 32
        alert("A temperatura em Fahrenheit é: " + far);
    </script>
</body>
</html>
