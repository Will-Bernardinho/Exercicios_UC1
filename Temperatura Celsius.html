<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converter temperatura em Celsius</title>
</head>
<body>
    <script>
        var tempf = prompt(" Informe a temperatura em Fahrenheit:");
        var tempc = 5 * (tempf-32) / 9;
        alert(" A temperatura em Celsius é: " + parseFloat(tempc));
    </script>
</body>
</html>
