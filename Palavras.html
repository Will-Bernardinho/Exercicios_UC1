<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palavras</title>
</head>
<body>
    <script>
        let num = prompt("Digite o numero");
        if (num == 1){
            alert("Alimentos");
        }
        else if(num == 2){
            alert("Bebidas");
        }
        else if (num == 3 || num == 4){
            alert("Cosmeticos");
        }
        else if (num = 5 || num == 6){
            alert("Medicamentos");
        }
        else
        alert("Não encontrado")
    </script>
</body>
</html>
