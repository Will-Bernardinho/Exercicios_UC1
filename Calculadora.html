<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>
    <script>
        let n = parseInt(prompt("Informe o numero: "));
        let saida = "";
        for (let i = 1; i<=10; i=i+1){
            let resultado =n*i;
            saida=saida + n +"x" +i+"=" + resultado + "\n";
        }
        alert(saida);
    </script>
</body>
</html>
