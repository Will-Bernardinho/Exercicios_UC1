<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        let n1 = parseInt(prompt("Informe um número"));
        let n2 = parseInt(prompt("Informe outro número"));
        let soma = n1 + n2;
        alert("A soma é: " + soma);
        */
       let n1=0;
       let n2=0;

       function coletar(){
        n1 = lerNumero("n1");
        n2 = lerNumero("n2");
       }

       function lerNumero(campo){
        let valor = document.getElementById(campo).value;
        let numero = valor.replace(".", "");
        numero = valor.replace(",", ".");
        return parseFloat(numero);
       }
       function somar () {
        coletar();
        let soma = n1+n2;
        //alert("A soma é: " +soma);(foi retirado pois a saida esta sendo feita pela função saida)
        saida(soma);
    }
    function saida(parametro){
        let result =document.getElementById("resultado");
        result.innerHTML= "<p> O resultado é " + parametro;
    }

    function subtração () {
        coletar();
        let soma = n1-n2;
        //alert("A subtração é: " +soma);
        saida(soma);

    }
    function multiplicação () {
        coletar();
        let soma = n1*n2;
        //alert("A multiplicação é: " +soma);
        saida(soma);
    }
    function divisao () {
        coletar();
        let soma = n1/n2;
        //alert("A divisão é: " +soma);
        saida(soma);
    }
    </script>
</head>
<body>
    <form>
         <input type = "number" name= "n1" id="n1" />
         <input type = "number" name= "n2" id="n2" />
         <input type = "button" value= "Soma" onclick = "somar ()"/>
         <input type = "button" value= "subtração" onclick = "subtração()"/>
         <input type = "button" value= "multiplicação" onclick = "multiplicação()"/>
         <input type = "button" value= "divisao"
            onclick = "divisao()"/>

            <div id="resultado"></div>
</form>
</body>
</html>
</body>
</html>
